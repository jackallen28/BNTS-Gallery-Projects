<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BNTS Heart Rate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">

    <!-- STANDBY: how to wear the wristband, then press the screen (also "No pulse found" if a measurement didn't work) -->
    <section id="standby" class="screen on">
      <canvas id="cv-standby"></canvas>
      <div id="sb-text" class="press long">
        <h1 id="sb-title">Wear the wristband with the sensor pressing on the top of your wrist</h1>
        <p id="sb-sub">Then press the screen to begin measuring your heart rate</p>
      </div>
    </section>

    <!-- MEASURE: waiting for a finger, then counting down while every beat is recorded -->
    <section id="measure" class="screen waiting">
      <div class="eyebrow">Measuring</div>

      <div id="m-panel" class="panel">
        <canvas id="cv-m-heart"></canvas>
        <div id="m-wait">Place your finger on the sensor</div>
        <div id="m-count">10</div>
        <div id="m-unit">seconds left</div>
        <div id="m-beats">0 beats</div>
      </div>

      <div id="m-wave-panel" class="panel">
        <span class="panel-label">Pulse</span>
        <canvas id="cv-wave-m"></canvas>
      </div>

      <div class="timer"><div id="m-bar" class="bar"></div></div>
    </section>

    <!-- RESULT: the average heart rate, shown for 10 seconds. This is the last screen. -->
    <section id="result" class="screen">
      <div class="eyebrow static">Your heart rate</div>

      <div id="bpm-panel" class="panel">
        <canvas id="cv-heart"></canvas>
        <div id="bpm-num">--</div>
        <div id="bpm-unit">BPM</div>
        <div id="basis">Average heart rate</div>
      </div>

      <div id="wave-panel" class="panel">
        <span class="panel-label">Pulse</span>
        <canvas id="cv-wave"></canvas>
      </div>

      <div class="timer"><div id="r-bar" class="bar"></div></div>
    </section>

    <!-- BNTS branding, shared by all screens.  Drop a logo.svg next to this file to show it top-left. -->
    <img id="logo" src="logo.svg" alt="" onerror="this.remove()">
    <img id="mark" src="bnts-pixels.svg" alt="">

    <div id="chip"></div>
    <pre id="debug"></pre>
  </main>
  <script src="measure.js"></script>
  <script src="app.js"></script>
</body>
</html>
